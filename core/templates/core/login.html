<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLlect — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        @keyframes open Lid {
            0%, 100% { transform: rotate(0deg); transform-origin: 20px 28px; }
            50% { transform: rotate(-18deg); transform-origin: 20px 28px; }
        }
        @keyframes particleUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.5); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
        }
        .animate-bin { animation: float 4s ease-in-out infinite; }
        .animate-lid { animation: openLid 3s ease-in-out infinite; }
        .particle-1 { animation: particleUp 2.5s ease-out infinite 0.2s; }
        .particle-2 { animation: particleUp 2.8s ease-out infinite 0.7s; }
        .particle-3 { animation: particleUp 2.2s ease-out infinite 1.1s; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
        
        <!-- Painel Esquerdo: Animação Reciclagem e Identidade NBR -->
        <div class="p-8 bg-gradient-to-br from-emerald-900/40 via-sky-900/30 to-slate-900 flex flex-col justify-between items-center text-center relative overflow-hidden border-b md:border-b-0 md:border-r border-slate-800">
            
            <div class="z-10 mt-4">
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase">
                    Plataforma de Logística Reversa
                </span>
                <h1 class="text-3xl font-extrabold text-white mt-3">Eco<span class="text-emerald-400">Llect</span></h1>
            </div>

            <!-- Lixeira Animada SVG -->
            <div class="relative my-8 animate-bin z-10">
                <!-- Partículas de Reciclagem Subindo -->
                <div class="absolute -top-6 left-6 w-3 h-3 bg-emerald-400 rounded-full particle-1 opacity-0"></div>
                <div class="absolute -top-8 left-12 w-2.5 h-2.5 bg-sky-400 rounded-full particle-2 opacity-0"></div>
                <div class="absolute -top-5 right-6 w-3 h-3 bg-amber-400 rounded-full particle-3 opacity-0"></div>

                <svg class="w-36 h-36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Sombra do Chão -->
                    <ellipse cx="50" cy="92" rx="30" ry="4" fill="#000000" fill-opacity="0.4" />
                    <!-- Tampa Animada -->
                    <g class="animate-lid">
                        <path d="M25 28 C25 25, 75 25, 75 28 L72 32 L28 32 Z" fill="#0284C7"/>
                        <rect x="42" y="21" width="16" height="5" rx="2" fill="#38BDF8"/>
                    </g>
                    <!-- Corpo da Lixeira Smart -->
                    <path d="M30 35 L34 85 C34 87, 36 88, 38 88 L62 88 C64 88, 66 87, 66 85 L70 35 Z" fill="#10B981"/>
                    <!-- Símbolo Universal de Reciclagem NBR (3 Setas Mobius Loop) -->
                    <path d="M50 48 L54 55 H46 L50 48 Z M45 57 L41 64 L48 68 L45 57 Z M55 57 L59 64 L52 68 L55 57 Z" fill="#FFFFFF" opacity="0.9"/>
                    <!-- Faixa de Destaque Laranja (Energia) -->
                    <rect x="31.5" y="40" width="37" height="3" fill="#F97316" rx="1.5"/>
                </svg>
            </div>

            <!-- Cores NBR das Lixeiras Informativas -->
            <div class="z-10 w-full">
                <p class="text-xs text-slate-400 mb-2">Padrão de Cores NBR 13230 Mapeado</p>
                <div class="flex justify-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-600 shadow-sm shadow-blue-500" title="Papel (Azul)"></span>
                    <span class="w-3 h-3 rounded-full bg-red-600 shadow-sm shadow-red-500" title="Plástico (Vermelho)"></span>
                    <span class="w-3 h-3 rounded-full bg-green-600 shadow-sm shadow-green-500" title="Vidro (Verde)"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500 shadow-sm shadow-yellow-500" title="Metal (Amarelo)"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-800 shadow-sm shadow-amber-700" title="Orgânico (Marrom)"></span>
                </div>
            </div>
        </div>

        <!-- Painel Direito: Formulário de Acesso -->
        <div class="p-8 flex flex-col justify-center">
            <h2 class="text-xl font-bold text-white mb-1">Acessar Conta</h2>
            <p class="text-sm text-slate-400 mb-6">Entre com suas credenciais para gerenciar coletas e pontos.</p>

            <form method="POST" action="" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">CPF ou E-mail</label>
                    <input type="text" name="username" required placeholder="000.000.000-00 ou usuario@email.com" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Senha de Acesso</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center text-slate-400 cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-800 text-emerald-500 focus:ring-0 bg-slate-950 mr-2">
                        Lembrar acesso
                    </label>
                    <a href="#" class="text-sky-400 hover:text-sky-300 transition">Esqueceu a senha?</a>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-emerald-500 via-sky-600 to-emerald-600 hover:from-emerald-600 hover:to-sky-700 text-white font-semibold py-2.5 rounded-xl text-sm shadow-lg shadow-emerald-950/50 transition duration-200 mt-2">
                    Entrar na Plataforma
                </button>
            </form>
        </div>

    </div>

</body>
</html>
